# Build the precompiled GPU image (docker/Dockerfile) and push it to GHCR.
# Pods pull ghcr.io/<owner>/collisionoperators instead of installing and
# precompiling Julia packages at boot. main publishes :latest (what the Runpod
# template pulls); a feat/docker-<name> branch publishes :<name> to test on a
# pod first.

name: Docker

on:
    push:
        branches:
            - main
            - feat/docker-*
        paths:
            - docker/**
            - .github/workflows/Docker.yml
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 180
        permissions:
            contents: read
            packages: write
        steps:
            # The depot with CUDA artifacts is several GB; the stock runner is
            # short on disk once the base image and build cache are added.
            - name: Free disk space
              run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
            # `COPY .` bakes .git into the image: don't leave the job token in
            # .git/config, or `git pull` inside a pod fails once it expires.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Cache busters for the dev-tools configs: a push to any of these
            # repos changes its REV, so only that layer onward is rebuilt.
            - name: Resolve config revisions and image tags
              id: rev
              run: |
                  rev() { git ls-remote "https://github.com/junyixu/$1.git" "$2" | cut -f1; }
                  echo "nvim=$(rev nvim-config feat/nvim-full-flag)" >> "$GITHUB_OUTPUT"
                  echo "zsh=$(rev zsh-config-public main)" >> "$GITHUB_OUTPUT"
                  echo "yazi=$(rev yazi-config-public main)" >> "$GITHUB_OUTPUT"
                  echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
                  if [ "$GITHUB_REF_NAME" = main ]; then tag=latest; else tag=${GITHUB_REF_NAME#feat/docker-}; tag=${tag//\//-}; fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  build-args: |
                      NVIM_REV=${{ steps.rev.outputs.nvim }}
                      ZSH_REV=${{ steps.rev.outputs.zsh }}
                      YAZI_REV=${{ steps.rev.outputs.yazi }}
                  tags: |
                      ghcr.io/${{ steps.rev.outputs.repo_owner }}/collisionoperators:${{ steps.rev.outputs.tag }}
                      ghcr.io/${{ steps.rev.outputs.repo_owner }}/collisionoperators:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true
